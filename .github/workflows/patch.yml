name: Patch

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install & freeze Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip freeze > requirements-lock.txt

      - name: Commit updated lockfile
        run: |
          if [ -n "$(git status --porcelain -- requirements-lock.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add requirements-lock.txt
            git commit -m "chore: update requirements-lock.txt [skip ci]"
            git push
          else
            echo "requirements-lock.txt unchanged, skipping commit."
          fi

      - name: Compute release tag
        id: release
        run: python prepare_release.py

  patch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      max-parallel: 30
      matrix:
        app:
          - youtube
          - youtube-music
          - reddit
          - reddit-adobo
          - twitter
          - twitter-x
          - instagram
          - gboard
          - speedtest
          - brave
          - proton-vpn
          - tiktok
          - tiktok-hxreborn
          - warp
          - inshot
          - google-photos
          - inure-github
          - inure-play
          - proton-pass
          - notesnook
          - termius

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Show runner IP
        run: curl -s https://api.ipify.org

      - name: Jitter delay before browser starts
        run: |
          delay=$(( RANDOM % 25 ))
          echo "Sleeping ${delay}s to avoid every matrix job hitting APKMirror in the same instant"
          sleep "$delay"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 25

      - name: Install Firefox runtime libraries
        run: |
          # Libs Camoufox's patched Firefox build needs on a bare
          # ubuntu-latest runner (equivalent to the old Chrome apt step).
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libx11-xcb1 libasound2t64 || sudo apt-get install -y libgtk-3-0 libx11-xcb1 libasound2

      - name: Install Python dependencies (from lockfile, pinned versions)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Fetch Camoufox browser binary
        run: |
          ok=0
          for i in 1 2 3; do
            if python3 -m camoufox fetch; then
              ok=1
              break
            fi
            delay=$(( 5 + RANDOM % 10 ))
            echo "camoufox fetch attempt $i failed, retrying in ${delay}s..."
            sleep "$delay"
          done

          camoufox_bin="$(python3 -m camoufox path || true)"
          if [ "$ok" -ne 1 ] || [ -z "$camoufox_bin" ] || [ ! -e "$camoufox_bin" ]; then
            echo "Camoufox browser binary not installed after 3 fetch attempts (path: '$camoufox_bin')" >&2
            exit 1
          fi
          echo "Camoufox binary confirmed at $camoufox_bin"

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > Panemi.keystore

      - name: Run script
        run: python -u main.py
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_APP: ${{ matrix.app }}
          KS_PATH: "Panemi.keystore"
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload patched APK artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk-${{ matrix.app }}
          path: dist/*.apk
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ matrix.app }}-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated signature files
        if: always()
        run: python commit_signature.py "${{ matrix.app }}"

      - name: Generate build provenance attestation
        if: ${{ hashFiles('dist/*.apk') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/*.apk
            !dist/microg*.apk

  finalize:
    needs: [prepare, patch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download patched APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: apk-*
          path: artifacts
          merge-multiple: true

      - name: Create release and clean up old releases
        run: python finalize_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          ARTIFACTS_DIR: artifacts
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}

  cleanup:
    needs: finalize
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee
        with:
          retain_days: 0
          keep_minimum_runs: 1
